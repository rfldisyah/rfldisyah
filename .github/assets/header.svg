<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 260" width="1000" height="260" role="img" aria-label="Refaldi - Full-Stack Developer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4c1d95"/>
      <stop offset="50%" stop-color="#6d28d9"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="260" fill="url(#bg)"/>

  <!-- bintang berkedip -->
  <g fill="#ffffff">
    <circle cx="90" cy="50" r="2"><animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="210" cy="140" r="1.5"><animate attributeName="opacity" values="1;0.2;1" dur="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="330" cy="40" r="2"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.5s" repeatCount="indefinite"/></circle>
    <circle cx="700" cy="45" r="2"><animate attributeName="opacity" values="1;0.2;1" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="820" cy="120" r="1.5"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="930" cy="60" r="2"><animate attributeName="opacity" values="0.4;1;0.4" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="560" cy="30" r="1.5"><animate attributeName="opacity" values="1;0.3;1" dur="3.8s" repeatCount="indefinite"/></circle>
  </g>

  <!-- teks -->
  <g font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-anchor="middle" fill="#ffffff">
    <text x="500" y="88" font-size="22" opacity="0.85">
      Hi there, I'm
      <animate attributeName="opacity" values="0;0.85" dur="1s" fill="freeze"/>
    </text>
    <text x="500" y="152" font-size="72" font-weight="700" letter-spacing="2">
      Refaldi
      <animate attributeName="opacity" values="0;1" dur="1.4s" fill="freeze"/>
    </text>
    <text x="500" y="188" font-size="20" fill="#ddd6fe">
      Full-Stack Developer  ·  Front-End Specialist  ·  Vibe Coder
      <animate attributeName="opacity" values="0;1" dur="2s" fill="freeze"/>
    </text>
  </g>

  <!-- gelombang -->
  <path fill="#ffffff" fill-opacity="0.12" d="M0,205 Q125,170 250,205 T500,205 T750,205 T1000,205 T1250,205 T1500,205 T1750,205 T2000,205 V260 H0 Z">
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-1000 0" dur="14s" repeatCount="indefinite"/>
  </path>
  <path fill="#ffffff" fill-opacity="0.18" d="M0,222 Q125,196 250,222 T500,222 T750,222 T1000,222 T1250,222 T1500,222 T1750,222 T2000,222 V260 H0 Z">
    <animateTransform attributeName="transform" type="translate" from="-500 0" to="0 0" dur="10s" repeatCount="indefinite"/>
  </path>
  <path fill="#0d1117" d="M0,240 Q125,222 250,240 T500,240 T750,240 T1000,240 T1250,240 T1500,240 T1750,240 T2000,240 V260 H0 Z">
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-1000 0" dur="7s" repeatCount="indefinite"/>
  </path>
</svg>
